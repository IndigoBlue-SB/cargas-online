<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Recuperar ventas de Bonito Josefina</title><style>body{font:17px Arial;max-width:750px;margin:40px auto;padding:20px;background:#f4f6f2;color:#18312d}section{background:white;padding:24px;border-radius:12px}button,input{font:inherit;margin:12px 0;padding:12px}button{background:#123f8c;color:white;border:0;border-radius:7px}button:disabled{opacity:.5}pre{white-space:pre-wrap}a{color:#123f8c}</style><section><h1>Recuperar ventas de Bonito Josefina</h1><p>Seleccioná el archivo <b>cargas-pendientes-1793369168942.json</b>. Se recuperan solamente las ventas y la confirmación para bingo de ese evento.</p><input id="file" type="file" accept=".json,application/json"><pre id="info">Esperando el archivo…</pre><button id="save" disabled>Guardar esta carga en Railway</button><p id="status" role="status"></p><a href="/?page=home">Volver a Cargas</a></section><script>
const targetId='c5dd35d0-9d34-4cd7-9590-7dbe93e44fce';
const file=document.getElementById('file'),info=document.getElementById('info'),save=document.getElementById('save'),status=document.getElementById('status');let draft,serverState,chosen;
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json'}});const data=await r.json();if(!r.ok)throw Error(data.error||'No se pudo completar la operacion');return data;}
function backup(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
file.onchange=async()=>{save.disabled=true;try{draft=JSON.parse(await file.files[0].text());chosen=draft.events?.find(e=>e.id===targetId);if(!chosen||!Array.isArray(chosen.sales)||!chosen.sales.length)throw Error('El archivo no contiene ventas de Bonito Josefina.');serverState=await api('/api/state');const current=serverState.events.find(e=>e.id===targetId);if(!current)throw Error('No se encontro el evento en tu sesion. Inicia sesion como Administrador en Cargas.');const units=chosen.bingoClosure?.soldUnits?.length||0;info.textContent='Archivo: '+file.files[0].name+'\nEvento: '+chosen.name+'\nVentas a recuperar: '+chosen.sales.length+' cargas\nBingos oficiales: '+units+'\nVentas actuales en Railway: '+current.sales.length+' cargas\nLos otros eventos y el balance actual se conservan.';save.disabled=false;status.textContent='Lista para guardar. Se descargara tambien una copia del evento actual antes de reemplazar sus ventas.';}catch(e){status.textContent=e.message;}};
save.onclick=async()=>{save.disabled=true;file.disabled=true;status.textContent='Guardando… No cierres esta pantalla.';try{const current=serverState.events.find(e=>e.id===targetId);backup(current,'bonito-josefina-antes-de-recuperar-'+Date.now()+'.json');const merged=structuredClone(serverState.events);const event=merged.find(e=>e.id===targetId);event.sales=structuredClone(chosen.sales);if(chosen.bingoClosure)event.bingoClosure=structuredClone(chosen.bingoClosure);if(chosen.bingoSeed)event.bingoSeed=chosen.bingoSeed;const history=new Map((current.bingoClosureHistory||[]).map(x=>[x.playId||x.confirmedAt,x]));for(const entry of chosen.bingoClosureHistory||[])history.set(entry.playId||entry.confirmedAt,entry);event.bingoClosureHistory=[...history.values()];await api('/api/events',{method:'PUT',body:JSON.stringify({events:merged,baseEventsVersion:serverState.eventsVersion})});const check=await api('/api/state');const saved=check.events.find(e=>e.id===targetId);if(JSON.stringify(saved.sales)!==JSON.stringify(chosen.sales)||JSON.stringify(saved.bingoClosure)!==JSON.stringify(event.bingoClosure))throw Error('Railway respondio, pero la verificacion no coincide. Conserva el archivo y avisa antes de continuar.');status.textContent='GUARDADO Y VERIFICADO EN RAILWAY: '+saved.sales.length+' cargas y '+(saved.bingoClosure?.soldUnits?.length||0)+' bingos oficiales. Ya no necesitas cargar estas ventas otra vez. En la pestana anterior podes tocar Volver a datos del servidor para salir del conflicto.';info.textContent='Recuperacion completada para '+saved.name;}catch(e){status.textContent='No se confirmo el guardado: '+e.message+' El archivo original sigue conservado. Volve a seleccionar el archivo para revisar el estado actual.';file.disabled=false;}};
</script></html>
